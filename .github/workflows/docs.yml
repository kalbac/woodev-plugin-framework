name: Deploy Docs

# The public documentation site is the Astro Starlight project in `website/`.
#   - push to main (site paths)  -> build + deploy to GitHub Pages
#   - pull_request (site paths)  -> build only, so a broken site fails the PR
#   - workflow_dispatch          -> build + deploy by hand
# GitHub Pages itself (Settings → Pages → Source: GitHub Actions) is enabled by the maintainer.
on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'woodev/class-plugin.php'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'woodev/class-plugin.php'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys queue behind each other (never cancelled mid-flight); PR builds get their own
  # per-ref group so they can neither block a deploy nor be dropped by one.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: Starlight's "last updated" date comes from git log.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        # The framework version comes from woodev/class-plugin.php at build time
        # (website/plugins/remark-framework-version.mjs).
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
