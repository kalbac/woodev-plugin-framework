name: Deploy Docs

# ⚠ DISABLED on push, 25.08.2026. The repo went PRIVATE, and GitHub Pages is not available for a
# private repo on the Free plan — the site at kalbac.github.io/woodev-plugin-framework is gone
# (the Pages API now returns 404) and every automatic run of this workflow would fail on deploy.
# Operator decision: «Закроем GH Pages. Ничего страшного. Потребителей у нас 0.»
#
# Kept rather than deleted, and still runnable by hand, so that publishing is one line away if the
# account moves to Pro or the repo goes public again: restore the `push:` block below.
on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'docs/**'
  #     - 'mkdocs.yml'
  #     - 'woodev/class-plugin.php'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material==9.6.7

      - name: Inject framework version into docs
        run: |
          VERSION=$(grep -oP "const VERSION = '\K[^']+" woodev/class-plugin.php)
          echo "Framework version: $VERSION"
          find docs -name "*.md" -o -name "*.html" | xargs sed -i "s/%%FRAMEWORK_VERSION%%/$VERSION/g"

      - name: Build docs
        run: mkdocs build --strict --site-dir _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
