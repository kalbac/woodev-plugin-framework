name: probe-1399
on:
  pull_request:
    branches: [main]
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.2']
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: probe
        run: |
          set +e
          apt list --installed 2>/dev/null | grep -E "^php${{ matrix.php }}-(cli|common)/" 
          php -i | grep -i -E "^(Build Date|Build System|Server API|PHP API|Configure Command)" | cut -c1-300
          cat > /tmp/a.php <<'PHP'
          <?php
          register_shutdown_function(function () { fwrite(STDERR, "SHUTDOWN-RAN\n"); });
          $mode = $argv[1] ?? '';
          if ($mode === 'ini' || $mode === 'ini-loop') { ini_set('memory_limit', '8M'); }
          if ($mode === 'ini-loop' || $mode === 'cli-loop') { $a = []; while (true) { $a[] = str_repeat('x', 4096); } }
          echo strlen(str_repeat('x', 64 * 1024 * 1024)), "\n";
          PHP
          run() { echo "== $*"; "$@"; echo "rc=$?"; }
          run php /tmp/a.php ini
          run php -d memory_limit=8M /tmp/a.php cli
          run php -d memory_limit=8M /tmp/a.php cli-loop
          run php /tmp/a.php ini-loop
          run php -d display_errors=1 -d html_errors=0 -d log_errors=0 -d error_reporting=-1 /tmp/a.php ini
          run php -d display_errors=0 -d log_errors=1 /tmp/a.php ini
          run php -d zend.signals=0 /tmp/a.php ini
          run php -r 'register_shutdown_function(function(){fwrite(STDERR,"SHUTDOWN-RAN\n");}); throw new Exception("x");'
