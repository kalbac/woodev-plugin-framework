name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # Читаем версию из class-plugin.php
  # ===========================================================================
  version:
    name: Read version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      current: ${{ steps.read.outputs.current }}
      previous: ${{ steps.read.outputs.previous }}
      changed: ${{ steps.read.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Read version from class-plugin.php
        id: read
        run: |
          CURRENT=$(grep -oP "const VERSION = '\K[^']+" woodev/class-plugin.php)
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT

          PREVIOUS=$(git show HEAD~1:woodev/class-plugin.php 2>/dev/null \
            | grep -oP "const VERSION = '\K[^']+" || echo "")
          echo "previous=${PREVIOUS}" >> $GITHUB_OUTPUT

          if [ "$CURRENT" != "$PREVIOUS" ] && [ -n "$PREVIOUS" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changed: ${PREVIOUS} → ${CURRENT}"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Version unchanged: ${CURRENT}"
          fi

  # ===========================================================================
  # PHPCS (все поддерживаемые версии) + PHPStan (целевая версия)
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: version

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-8.1-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.1-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Security audit
        # Audit the lock file: this framework declares no runtime (non-dev) dependencies,
        # so `composer audit --no-dev` finds no installed packages and errors out. `--locked`
        # audits every locked dependency (the dev toolchain) for known advisories.
        run: composer audit --locked

      - name: Run PHPCS
        run: ./vendor/bin/phpcs --warning-severity=0

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --memory-limit=4G

  # ===========================================================================
  # PHP Compatibility check (7.4 → 8.2)
  # ===========================================================================
  compat:
    name: PHP Compat (${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check PHP syntax
        run: find woodev -name '*.php' -print0 | xargs -0 php -l | grep -v "^No syntax errors" || true

  # ===========================================================================
  # Юнит-тесты (PHP 7.4 – 8.2)
  # ===========================================================================
  unit-tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # sodium is required: the Ed25519 envelope-verifier vector tests skip
          # without it, and LicenseEnvelopeVerifierTest::test_sodium_available_on_ci
          # fails the build if it ever goes missing here.
          extensions: sodium
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run unit tests
        run: composer test:unit

  # ===========================================================================
  # JS-тесты (wp-scripts test-unit-js — jsdom, наш jest owner).
  # НИКОГДА не подменять на `npx jest` — без конфига wp-scripts jest падает
  # обратно на node-окружение и теряет jsdom (см.
  # docs-internal/gotchas/npx-jest-bypasses-wp-scripts-jsdom.md).
  #
  # timeout-minutes низкий и намеренный: баг из SP-5 (s46) в
  # map-provider-yandex.js вызывал неограниченную рекурсию по микрозадачам,
  # которая забивала очередь макрозадач настолько, что не срабатывал даже
  # собственный таймаут теста в jest — набор просто висел вечно без вывода.
  # Без job-таймаута такое зависание сжигает весь лимит джобы впустую.
  # ===========================================================================
  test-js:
    name: JS Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run JS tests
        run: npm run test:js

  # ===========================================================================
  # Поиск секретов в коде.
  #
  # Зачем, если у репозитория уже включены secret scanning и push protection:
  # на БЕСПЛАТНОМ публичном репозитории GitHub сопоставляет только ПРОВАЙДЕРСКИЕ
  # паттерны (AWS, Stripe, токены GitHub). Произвольные вендорские ключи ловит
  # опция "non-provider patterns" — часть платного Secret Protection, её нет
  # ни в UI, ни через API.
  #
  # Дыра не гипотетическая: в s55 в этот публичный репозиторий был закоммичен и
  # запушен bearer-токен Яндекс.Доставки, и ничто этого не остановило.
  # См. docs-internal/gotchas/public-repo-third-party-credentials.md.
  #
  # Джоба намеренно НЕ ставит зависимости: чем меньше в дереве чужого кода, тем
  # меньше ложных срабатываний, а vendor/ и node_modules/ и так в allowlist.
  # ===========================================================================
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Бинарь напрямую, а не gitleaks-action: у официального экшена платная
      # лицензия для организаций, и упереться в это на живом CI мы не хотим.
      # Версия закреплена — та же, на которой конфиг проверен локально.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gitleaks.tar.gz "$URL"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      # `--no-git`: проверяем ДЕРЕВО, а не историю. Отвечает на вопрос «есть ли
      # секрет в коде, который уедет в main», и не зависит от глубины клона.
      # `--redact`: находка не должна печатать сам секрет в публичный лог сборки.
      - name: Scan for secrets
        run: /tmp/gitleaks detect --no-git --config .gitleaks.toml --redact --verbose

  # ===========================================================================
  # Сборка JS-бандла и проверка паритета с закоммиченным woodev/assets/build/
  # Независимый job: node-сбой не должен маскировать PHP-матрицу
  # ===========================================================================
  assets:
    name: Assets build parity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify build parity
        run: |
          DIFF=$(git diff -- woodev/assets/build/)
          # Run git status separately so its failure fails the job; the `|| true`
          # below tolerates only the grep filtering step, not a git error.
          STATUS=$(git status --porcelain woodev/assets/build/)
          UNTRACKED=$(printf '%s\n' "$STATUS" | grep '^??' || true)
          if [ -n "$DIFF" ] || [ -n "$UNTRACKED" ]; then
            echo "::error::The committed bundle in woodev/assets/build/ does not match the build output."
            echo "Run 'npm ci && npm run build' locally, then commit the updated files."
            echo ""
            if [ -n "$DIFF" ]; then
              echo "--- Modified files ---"
              git diff --name-only -- woodev/assets/build/
            fi
            if [ -n "$UNTRACKED" ]; then
              echo "--- Untracked files ---"
              echo "$UNTRACKED"
            fi
            exit 1
          fi
          echo "Build parity check passed."

  # ===========================================================================
  # Публикуем релиз — только если:
  # • пуш в main (не PR)
  # • версия изменилась
  # • lint, unit-tests и assets (проверка собранного бандла) прошли
  # ===========================================================================
  release:
    name: Publish Release v${{ needs.version.outputs.current }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, lint, unit-tests, test-js, assets, secrets]
    permissions:
      contents: write

    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.version.outputs.changed == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install git-cliff
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: git-cliff

      - name: Install Composer dependencies (production only)
        run: composer install --prefer-dist --no-progress --no-interaction --no-dev --optimize-autoloader

      - name: Create and push tag
        run: |
          TAG="v${{ needs.version.outputs.current }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

      - name: Generate release notes
        run: git cliff --current --output RELEASE_NOTES.md

      - name: Update CHANGELOG.md
        run: |
          git cliff --output CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update CHANGELOG.md for v${{ needs.version.outputs.current }}"
          git push origin main

      - name: Build release ZIP
        id: zip
        run: |
          VERSION="${{ needs.version.outputs.current }}"
          ZIP_NAME="woodev-plugin-framework-${VERSION}.zip"
          mkdir -p /tmp/release/woodev-plugin-framework

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.ai' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='vendor/bin' \
            --exclude='*.xml' \
            --exclude='*.neon' \
            --exclude='*.toml' \
            --exclude='.wp-env*.json' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            --exclude='RELEASE_NOTES.md' \
            --exclude='composer.lock' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='src' \
            --exclude='.nvmrc' \
            --exclude='babel.config.js' \
            ./ /tmp/release/woodev-plugin-framework/

          cd /tmp/release && zip -r "$ZIP_NAME" woodev-plugin-framework/
          echo "zip_path=/tmp/release/${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.current }}
          name: "Woodev Plugin Framework ${{ needs.version.outputs.current }}"
          body_path: RELEASE_NOTES.md
          files: ${{ steps.zip.outputs.zip_path }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.current, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
